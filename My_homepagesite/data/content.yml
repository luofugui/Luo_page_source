########################### Experience ##############################
experience:
  enable: true
  title: 'EXPERIENCE'
  experience_list:
    - name: Senior Embedded Software Engineer
      company: Zenitek Intelligent Technology Co., Ltd.
      duration: 'December 2021 - August 2023'
      content: Owned embedded software development for an STM32F7-based power detection system. Rearchitected 64-channel data acquisition, signal processing, and power computation, reducing the sampling cycle from 1s to 100ms. Optimized the ADC measurement pipeline and server communication interface, improving detection accuracy and enabling stable real-time transmission.

    - name: Senior Embedded Software Engineer
      company: Shanghai Quicktron Intelligent
      duration: 'April 2021 - December 2021'
      content: Developed, maintained, and tested radar calibration software for robotic panels, improving calibration accuracy by 38%. Built warehouse robot control and communication modules with the motion-control team, improving response speed and resolving field failures across multiple provinces.

    - name: Embedded Software Engineer
      company: Focused Photonics Inc.
      duration: 'October 2018 - April 2021'
      content: Helped bring a dust-monitoring instrument from prototype to production, developing test and embedded software while resolving thermal and stability issues. Improved Modbus data transmission efficiency by 25% and redesigned the multi-monitoring system to reduce manual verification effort and operational cost.

    - name: Embedded Software Engineer
      company: Sunward Intelligent Equipment Co., Ltd.
      duration: 'July 2017 - September 2018'
      content: Developed hardware and software for a beyond-visual-line-of-sight drone communication module, reducing hardware cost by 15%. Redesigned multi-channel transmission control, reducing packet loss and extending communication range over the original module.

