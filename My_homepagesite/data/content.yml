############################# portfolio ################################
portfolio:
  enable: true
  title: 'MY WORK'
  portfolio_list:
    - name: SmartRing
      image: 'images/portfolio/SmartRing.jpeg'
      url: smart-ring/
      buttontext: 'VIEW PROJECT'
      description: SmartRing is an AI-enhanced wearable interface for meetings, built around an nRF52840-based prototype. The project integrates IMU-based gesture control, BLE HID interaction, audio capture, embedded UI, and battery management. I also developed a real-time AI workflow using Google Gemini APIs to transform live speech into meeting summaries, key decisions, and action items for hands-free documentation.

    - name: MagicUp
      image: 'images/portfolio/MagicUp.png'
      url: https://www.youtube.com/watch?v=bLvHS5BqWbs
      buttontext: 'VIEW DEMO'
      description: MagicUp is an Orange Pi 5 based smart mirror built during a 48-hour Duke AI Hackathon. I integrated the camera, microphone, display, and custom enclosure for real-time AR overlays, then developed an offline voice-activated AI workflow using Snowboy, face parsing, and OpenAI/Google APIs to generate personalized digital makeup effects.

    - name: AR Glass Prototype
      image: 'images/portfolio/ARGlass.png'
      url: '#portfolio'
      buttontext: 'IN PROGRESS'
      description: An ongoing low-cost AR glasses prototype based on a BB solution and a low-power ESP32-S3 platform. The current stage has completed the 3D mechanical model and hardware bring-up/debugging. Planned features include music recognition, photo-based object/scene recognition assistance, and short visual plus voice navigation combined with a mobile app for walking or cycling.

