########################### Experience ##############################
experience:
  enable: true
  title: 'EXPERIENCE'
  experience_list:
    - name: Senior Embedded Software Engineer
      company: Shanghai Quicktron Intelligent
      duration: 'April 2021 – December 2023'
      content: Led radar calibration code achieving 50% accuracy improvement. Refactored code into modular architectures reducing complexity by 30%. Managed bootloader code achieving 20% boot time reduction.

    - name: Senior Embedded Software Engineer
      company: Zenitek Intelligent Technology Co., Ltd.
      duration: 'December 2021 – August 2023'
      content: Developed power detection equipment embedded software, reducing software bugs by 20%. Improved algorithm accuracy by 15% through key algorithm development and verification.

    - name: Junior Embedded Software Engineer
      company: Focused Photonics Inc.
      duration: 'October 2018 – April 2021'
      content: Led iterative software development for dust monitoring devices, reducing development cycles by 30%. Designed human-machine interaction logic improving system responsiveness by 20%.

